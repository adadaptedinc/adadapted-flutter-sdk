org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Both flags below opt out of AGP defaults that are now `true`, so every Gradle
# configure warns that they are deprecated and will be removed in AGP 10. They
# are kept deliberately: the migration that removes them is blocked upstream,
# not merely unfinished.
#
# Setting `android.builtInKotlin=true` hands the Kotlin version to AGP, and every
# released AGP 9.x — 9.1.0 through 9.5.0-alpha05, verified from their POMs —
# bundles KGP 2.2.10. Flutter's Gradle plugin hard-errors below 2.2.20
# (`errorKGPVersion` in DependencyVersionChecker.kt), so the build fails at
# plugin application:
#
#     Your project's Kotlin version (2.2.10) is lower than Flutter's minimum
#     supported version of 2.2.20.
#
# There is no supported way to raise AGP's bundled Kotlin, and bypassing the
# check with `--android-skip-build-dependency-validation` would really compile
# against 2.2.10 rather than the 2.4.20 declared here — a downgrade, not a fix.
# Bumping AGP does not help, and AGP 9.4.0 additionally requires Gradle 9.6.0.
#
# Recheck when either side moves: an AGP whose bundled KGP is >= 2.2.20, or a
# Flutter release that lowers errorKGPVersion. Until then removing these flags
# breaks the example build, and when AGP 10 removes them the migration becomes
# forced — so this needs to resolve before then.
#
# https://docs.flutter.dev/release/breaking-changes/migrate-to-built-in-kotlin/for-app-developers

# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
