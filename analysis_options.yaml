include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Every public member carries documentation in this package, the way the
    # other AdAdapted SDKs require JSDoc. Treated as an error so it cannot rot.
    public_member_api_docs: error
    # A dropped future here is a dropped API request or a dropped report.
    unawaited_futures: error
  exclude:
    - build/**
    - android/**
    - ios/**

linter:
  rules:
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - prefer_final_locals
    - require_trailing_commas
    - sort_pub_dependencies
    - unawaited_futures
