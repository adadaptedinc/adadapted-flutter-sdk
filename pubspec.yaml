name: adadapted_flutter_sdk
description: >-
  The AdAdapted Flutter SDK. Integrates the AdAdapted ad platform into a Flutter
  app: ad zones, keyword intercepts, add-to-list payloads and event reporting.
version: 0.1.1
homepage: https://github.com/adadaptedinc/adadapted-flutter-sdk
repository: https://github.com/adadaptedinc/adadapted-flutter-sdk
issue_tracker: https://github.com/adadaptedinc/adadapted-flutter-sdk/issues

# Surfaced as filters on pub.dev.
topics:
  - advertising
  - ads
  - sdk

environment:
  sdk: ^3.12.0
  # 3.44 is where plugin modules get Kotlin from Flutter itself, which is what
  # android/build.gradle.kts is written against.
  flutter: ">=3.44.0"

dependencies:
  # Lets the session window and the refresh countdown be driven by a fake clock
  # in tests. Every wall-clock read in this package goes through it.
  clock: ^1.1.3
  flutter:
    sdk: flutter
  http: ^1.6.0
  url_launcher: ^6.3.2
  visibility_detector: ^0.4.0+2
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # Imported directly by the fake web view platform the AdZone tests run against.
  webview_flutter_platform_interface: ^2.15.1

flutter:
  assets:
    - assets/report_icon.png
  plugin:
    platforms:
      android:
        package: com.adadapted.flutter_sdk
        pluginClass: AdadaptedFlutterSdkPlugin
      ios:
        pluginClass: AdadaptedFlutterSdkPlugin
