# IMPORTANT: secrets.CICD_GITHUB_TOKEN must be newly generated every year.
# One year is the longest expiration time that can be chosen for custom access tokens.
# Secrets are set here for the Org: https://github.com/organizations/adadaptedinc/settings/secrets/actions
# Fine-grained tokens can be generated here: https://github.com/settings/tokens?type=beta
#   - Expiration: 1 year out
#   - Resource Owner: adadaptedinc
#   - Repository Access: must include this repository (the header copied from the
#     other SDK repos claims All Repositories; verify, because this repo is newer
#     than the token and a "only select repositories" token will not cover it)
#   - Permissions:
#       - Repository Permissions:
#           - Actions: Read and Write
#           - Contents: Read and Write
#       - Organization Permissions: none

name: Merge Branch
on:
    pull_request:
        branches: [main]
        types:
            - opened
            - reopened
            - synchronize
    push:
        branches:
            - "**"
        tags-ignore:
            - "**"
permissions:
    contents: read
jobs:
    validation:
        name: validation # Used for a Github environment protection ruleset. The name must be the same for the ruleset to work.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
            - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  channel: stable
                  cache: true
            - name: Flutter Install
              run: flutter pub get
            - name: Flutter Install (example app)
              run: flutter pub get
              working-directory: example
            - name: Format Validation
              run: dart format --output=none --set-exit-if-changed .
            - name: Linting Validation
              run: flutter analyze
            - name: Linting Validation (example app)
              run: flutter analyze
              working-directory: example
            # The version the SDK reports to the API is a constant, because Dart
            # has no runtime access to its own pubspec. A mismatch is invisible
            # at runtime and would ship as SDK version reporting gone stale.
            - name: Version Validation
              run: dart run tool/check_version.dart
            - name: Unit Tests
              run: flutter test
            # flutter analyze does not look at android/ or ios/, so nothing above
            # this compiles a line of Kotlin or Swift. Building the example is
            # what stops a native break — or a Gradle bump Renovate automerged —
            # from going green and getting tagged. The iOS half of that lives in
            # ios_validation below, because it needs a macOS runner.
            - name: Android Build Validation
              run: flutter build apk --debug
              working-directory: example
    # Whether the iOS build needs to run at all. macOS runners bill at roughly
    # ten times the Linux rate, and most merges here are Dart, docs or CI, none
    # of which can break a Swift compile. This job is pennies on Linux and lets
    # the expensive one stay skipped.
    detect_ios_changes:
        name: detect ios changes
        # Both `push` and `pull_request` fire for a branch that has a PR open, so
        # an unguarded job runs twice. `validation` wears that on Linux; a macOS
        # runner should not. Pull requests and main are between them every path
        # that reaches a release.
        if: ${{ github.event_name == 'pull_request' || github.ref_name == 'main' }}
        runs-on: ubuntu-latest
        outputs:
            ios: ${{ steps.filter.outputs.ios }}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
                  # The diff is taken against a base commit that a shallow
                  # checkout does not contain.
                  fetch-depth: 0
            - name: Decide whether the iOS build is needed
              id: filter
              env:
                  BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
              run: |
                  # A branch's first push reports an all-zero "before", and a
                  # force-push can name a commit this checkout no longer has.
                  # Either way the diff is unknowable, so build rather than
                  # guess — skipping is the answer that can be silently wrong.
                  if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
                    echo "No usable base commit; running the iOS build."
                    echo "ios=true" >> "$GITHUB_OUTPUT"
                    exit 0
                  fi

                  CHANGED=$(git diff --name-only "$BASE" HEAD)
                  echo "Changed files:"
                  echo "$CHANGED" | sed 's/^/  /'

                  # ios/ and example/ios/ are the Swift itself. The pubspecs and
                  # the example's lockfile are here because a dependency change
                  # changes which plugin code gets compiled — that covers
                  # Renovate's cocoapods and pub PRs and its lockFileMaintenance
                  # PRs, which touch only the lock. The workflow directory is
                  # here so a change to this job is tested by the job.
                  if echo "$CHANGED" | grep -qE '^(ios/|example/ios/|pubspec\.yaml$|example/pubspec\.(yaml|lock)$|\.github/workflows/)'; then
                    echo "ios=true" >> "$GITHUB_OUTPUT"
                    echo "iOS build required."
                  else
                    echo "ios=false" >> "$GITHUB_OUTPUT"
                    echo "Nothing iOS-relevant changed; skipping the iOS build."
                  fi
    # NOTE: this job is deliberately NOT in main's required-checks ruleset. It is
    # conditional, and a required check that sometimes does not run needs the
    # ruleset configured to match. Wire it in deliberately or not at all — and do
    # not rename `validation`, which the ruleset matches literally.
    ios_validation:
        name: ios validation
        needs: [detect_ios_changes]
        if: needs.detect_ios_changes.outputs.ios == 'true'
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
            - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  channel: stable
                  cache: true
            - name: Flutter Install
              run: flutter pub get
            - name: Flutter Install (example app)
              run: flutter pub get
              working-directory: example
            # The example keeps its Podfile on purpose, so this compiles the
            # CocoaPods path as well as the Swift Package Manager one. macOS
            # runners ship CocoaPods, so nothing needs installing — but the
            # Podfile is why the build cannot run without it.
            - name: iOS Build Validation
              run: flutter build ios --debug --simulator --no-codesign
              working-directory: example
    create_release_version:
        # `always()` is required because ios_validation is skipped on most
        # merges, and a skipped dependency would otherwise skip this job and
        # silently stop cutting releases. The conditions below therefore have to
        # state what is actually wanted: validation passed, and the iOS build
        # did not fail (skipped is fine).
        if: ${{ always() && github.event_name == 'push' && github.ref_name == 'main' && needs.validation.result == 'success' && needs.detect_ios_changes.result == 'success' && needs.ios_validation.result != 'failure' }}
        needs: [validation, detect_ios_changes, ios_validation]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            new_tag: ${{steps.version.outputs.tag}}
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
              with:
                  ref: main
                  # release_decision.dart reads the pubspec at the SHA the push
                  # started from, which a shallow checkout does not have.
                  fetch-depth: 0
            - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
              with:
                  channel: stable
                  cache: true
            # The tag comes from pubspec.yaml, not from a conventional-commit
            # bump. Nothing stamps the version into the artifact the way
            # `npm version` does for the RN and JS SDKs — publish.yml reads the
            # version, it never sets it — so pubspec.yaml and
            # lib/src/version.dart, the constant every request reports as
            # sdk_version, are both maintained by hand.
            #
            # Not every merge to main is a release, though. Docs, CI and the
            # dependency bumps Renovate automerges all land here without touching
            # the version, and failing those would leave main permanently red
            # between releases. The rule lives in tool/release_decision.dart so
            # it can be tested — see test/release_decision_test.dart.
            - name: Decide whether to release
              id: version
              run: dart run tool/release_decision.dart "${{ github.event.before }}"
            # Creating the tag with CICD_GITHUB_TOKEN rather than GITHUB_TOKEN is
            # load-bearing: GitHub does not trigger workflows for events raised by
            # the default token, so publish.yml would never fire and the package
            # would silently stop being published while releases kept appearing.
            - name: Create a GitHub release
              if: steps.version.outputs.release == 'true'
              uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
              with:
                  token: ${{secrets.CICD_GITHUB_TOKEN}}
                  tag: ${{steps.version.outputs.tag}}
                  name: Release ${{steps.version.outputs.tag}}
                  generateReleaseNotes: true
